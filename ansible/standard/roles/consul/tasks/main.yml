---
- name: Ensure consul version is pinned
  ansible.builtin.template:
    src: "etc/apt/preferences.d/consul.j2"
    dest: "/etc/apt/preferences.d/consul"
    owner: root
    group: root
    mode: "0644"
  tags:
    - consul

# update_cache here, not only in apt_update: that ran before the HashiCorp
# repository was added.
- name: Ensure consul is installed
  ansible.builtin.apt:
    name: "consul={{ consul.version }}*"
    state: present
    update_cache: true
  tags:
    - consul
